<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Review Estimate</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Segoe UI,sans-serif;background:#1e1e2e;color:#cdd6f4;padding:2rem}
h1{color:#89b4fa;margin-bottom:.5rem}
p.sub{color:#6c7086;margin-bottom:1.5rem}
.nav{display:flex;gap:.5rem;margin-bottom:2rem;flex-wrap:wrap}
.nav a{background:#313244;padding:.5rem 1rem;border-radius:6px;color:#89b4fa;text-decoration:none;font-size:.85rem}
.nav a:hover{background:#45475a}
.card{background:#313244;padding:1.5rem;border-radius:8px}
label{display:block;margin:1rem 0 .3rem;color:#a6adc8}
input,select,textarea{padding:.5rem;background:#45475a;border:1px solid #585b70;border-radius:6px;color:#cdd6f4;font-size:.9rem}
input:focus{outline:none;border-color:#89b4fa}
table{width:100%;border-collapse:collapse;margin:1rem 0}
th,td{padding:.4rem;text-align:left;border-bottom:1px solid #45475a;vertical-align:middle}
th{background:#45475a;color:#89b4fa;font-size:.8rem}
.cat-select{width:90px;font-size:.8rem}
.unit-select{width:70px;font-size:.8rem}
.qty-input{width:65px;font-size:.8rem}
.rate-input{width:75px;font-size:.8rem}
.desc-input{min-width:140px;font-size:.8rem}
.btn{background:#89b4fa;color:#1e1e2e;border:none;padding:.7rem 1.5rem;border-radius:6px;font-weight:700;cursor:pointer;margin-top:1rem;font-size:1rem}
.btn:hover{background:#74c7ec}
.btn-sm{background:#45475a;color:#cdd6f4;border:none;padding:.3rem .5rem;border-radius:4px;cursor:pointer;font-size:.8rem}
a{color:#89b4fa}
</style>
</head>
<body>
<h1>Review AI Estimate</h1>
<p class="sub">Edit line items as needed, then save as a quote</p>
<div class="nav">
<a href="/business">Dashboard</a><a href="/business/clients">Clients</a>
<a href="/business/quotes">Quotes</a><a href="/business/invoices">Invoices</a>
<a href="/business/hours">Hours</a><a href="/business/expenses">Expenses</a>
<a href="/business/quotes/estimate">AI Estimate</a><a href="/business/rates">Rates</a><a href="/business/social">Social</a><a href="/business/leads">Leads</a>
</div>
<div class="card">
<form method="POST" action="/business/quotes/save-estimate">
<input type="hidden" name="client_name" value="{{client_name}}">
<input type="hidden" name="tax_rate" value="{{tax_rate}}">
<label>Client: <strong>{{client_name}}</strong></label>
<label>Line Items</label>
<table id="items">
<tr><th style="width:30px">#</th><th>Description</th><th style="width:90px">Type</th><th style="width:55px">Qty</th><th style="width:55px">Unit</th><th style="width:65px">Rate</th><th style="width:65px">Total</th><th style="width:30px"></th></tr>
{% for i in items %}
<tr>
<td class="line-num">{{loop.index}}</td>
<td><input class="desc-input" name="desc[]" value="{{i.desc}}"></td>
<td>
<select class="cat-select" name="type[]">
<option value="Labor" {{'selected' if i.type=='Labor'}}>Labor</option>
<option value="Material" {{'selected' if i.type=='Material'}}>Material</option>
<option value="Subcontractor" {{'selected' if i.type=='Subcontractor'}}>Sub</option>
<option value="Equipment" {{'selected' if i.type=='Equipment'}}>Equipment</option>
<option value="Permit" {{'selected' if i.type=='Permit'}}>Permit</option>
<option value="Transportation" {{'selected' if i.type=='Transportation'}}>Transport</option>
</select>
</td>
<td><input class="qty-input" name="qty[]" type="number" step="0.01" value="{{i.qty}}"></td>
<td>
<select class="unit-select" name="unit[]">
<option value="hour" {{'selected' if i.unit=='hour'}}>hour</option>
<option value="sq ft" {{'selected' if i.unit=='sq ft'}}>sq ft</option>
<option value="linear ft" {{'selected' if i.unit=='linear ft'}}>lin ft</option>
<option value="each" {{'selected' if i.unit=='each'}}>each</option>
<option value="load" {{'selected' if i.unit=='load'}}>load</option>
<option value="day" {{'selected' if i.unit=='day'}}>day</option>
<option value="sq yd" {{'selected' if i.unit=='sq yd'}}>sq yd</option>
<option value="mile" {{'selected' if i.unit=='mile'}}>mile</option>
<option value="lump" {{'selected' if i.unit=='lump'}}>lump</option>
</select>
</td>
<td><input class="rate-input" name="rate[]" type="number" step="0.01" value="{{i.rate}}"></td>
<td class="line-total">${{"%.2f"|format(i.total)}}</td>
<td><button type="button" class="btn-sm" onclick="this.closest('tr').remove();renumber()">X</button></td>
</tr>
{% endfor %}
</table>
<button type="button" class="btn-sm" onclick="addLine()">+ Add Line</button>
<label>Notes</label><textarea name="notes" rows="2" style="width:100%"></textarea>
<button class="btn">Save as Quote</button>
<a href="/business/quotes/estimate" style="margin-left:1rem;color:#89b4fa">Start Over</a>
</form>
</div>
<script>
function addLine(){var t=document.getElementById('items');var proto=t.rows[1];var r=proto.cloneNode(true);r.querySelectorAll('input').forEach(function(i){i.value=''});r.querySelector('.line-total').textContent='$0.00';t.appendChild(r);renumber()}
function renumber(){var rows=document.getElementById('items').querySelectorAll('.line-num');rows.forEach(function(e,i){e.textContent=i+1})}
document.getElementById('items').addEventListener('input',function(e){var row=e.target.closest('tr');if(!row)return;var qty=parseFloat(row.querySelector('.qty-input').value)||0;var rate=parseFloat(row.querySelector('.rate-input').value)||0;row.querySelector('.line-total').textContent='$'+(qty*rate).toFixed(2)})
</script>
</body>
</html>
