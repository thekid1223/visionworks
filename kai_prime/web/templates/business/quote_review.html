{% extends "business/base.html" %}
{% block title %}Review Quote — Vision Works{% endblock %}
{% block content %}
<div class="page-header"><h2>Review Quote<small>Check the line items, then save</small></h2></div>
<div class="form-card">
<form method="POST" action="/business/quotes/save-estimate">
<input type="hidden" name="client_name" value="{{client_name}}">
<input type="hidden" name="tax_rate" value="{{tax_rate}}">
<div class="form-group"><label>Customer: <strong style="color:var(--text)">{{client_name}}</strong></label></div>
<div class="form-group">
<label>Line Items</label>
<button type="button" class="btn btn-secondary btn-sm" onclick="addLine()" style="margin-top:.3rem">+ Add Line</button>
</div>
<div class="table-wrap" style="box-shadow:none">
<div class="table-scroll">
<table id="items">
<tr><th style="width:30px">#</th><th>Description</th><th>Type</th><th style="width:60px">Qty</th><th>Unit</th><th style="width:70px">Rate</th><th style="width:70px">Total</th><th style="width:34px"></th></tr>
{% for i in items %}
<tr>
<td class="line-num">{{loop.index}}</td>
<td><input class="desc-input" style="min-width:140px;font-size:.9rem" name="desc[]" value="{{i.desc}}"></td>
<td><select class="cat-select" style="width:110px;font-size:.9rem" name="type[]"><option value="Labor" {{'selected' if i.type=='Labor'}}>Labor</option><option value="Material" {{'selected' if i.type=='Material'}}>Material</option><option value="Subcontractor" {{'selected' if i.type=='Subcontractor'}}>Sub</option><option value="Equipment" {{'selected' if i.type=='Equipment'}}>Equipment</option><option value="Permit" {{'selected' if i.type=='Permit'}}>Permit</option><option value="Transportation" {{'selected' if i.type=='Transportation'}}>Transport</option></select></td>
<td><input class="qty-input" style="width:60px;font-size:.9rem" name="qty[]" type="number" step="0.01" value="{{i.qty}}"></td>
<td><select class="unit-select" style="width:90px;font-size:.9rem" name="unit[]"><option value="hour" {{'selected' if i.unit=='hour'}}>hour</option><option value="sq ft" {{'selected' if i.unit=='sq ft'}}>sq ft</option><option value="linear ft" {{'selected' if i.unit=='linear ft'}}>lin ft</option><option value="each" {{'selected' if i.unit=='each'}}>each</option><option value="load" {{'selected' if i.unit=='load'}}>load</option><option value="day" {{'selected' if i.unit=='day'}}>day</option><option value="sq yd" {{'selected' if i.unit=='sq yd'}}>sq yd</option><option value="mile" {{'selected' if i.unit=='mile'}}>mile</option><option value="lump" {{'selected' if i.unit=='lump'}}>lump</option></select></td>
<td><input class="rate-input" style="width:70px;font-size:.9rem" name="rate[]" type="number" step="0.01" value="{{i.rate}}"></td>
<td class="line-total" style="font-weight:700;font-size:.9rem">${{"%.2f"|format(i.total)}}</td>
<td><button type="button" class="btn btn-danger btn-sm" onclick="this.closest('tr').remove();renumber()">X</button></td>
</tr>
{% endfor %}
</table>
</div>
</div>
<div class="form-group"><label>Notes</label><textarea name="notes" rows="2"></textarea></div>
<div class="btn-group">
<button class="btn btn-primary">Save as Quote</button>
<a class="btn btn-secondary" href="/business/quotes/estimate">Start Over</a>
</div>
</form>
</div>
<script>
function addLine(){var t=document.getElementById('items');var p=t.rows[1];var r=p.cloneNode(true);r.querySelectorAll('input').forEach(function(i){i.value=''});r.querySelector('.line-total').textContent='$0.00';t.appendChild(r);renumber()}
function renumber(){var rows=document.getElementById('items').querySelectorAll('.line-num');rows.forEach(function(e,i){e.textContent=i+1})}
document.getElementById('items').addEventListener('input',function(e){var row=e.target.closest('tr');if(!row)return;var q=parseFloat(row.querySelector('.qty-input').value)||0;var r=parseFloat(row.querySelector('.rate-input').value)||0;row.querySelector('.line-total').textContent='$'+(q*r).toFixed(2)})
</script>
{% endblock %}
