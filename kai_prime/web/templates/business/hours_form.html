{% extends "business/base.html" %}
{% block title %}Edit Hours — Vision Works{% endblock %}
{% block content %}
<div class="page-header"><h2>Edit Hours</h2></div>
<div class="form-card">
<form method="POST">
<div class="form-group"><label>Employee Name</label><input name="employee" value="{{h.employee}}" required></div>
<div class="form-row">
<div class="form-group"><label>Date</label><input name="date" type="date" value="{{h.date}}"></div>
<div class="form-group"><label>Hours</label><input name="hours" type="number" step="0.25" value="{{h.hours}}" required></div>
</div>
<div class="form-row">
<div class="form-group"><label>Hourly Rate ($)</label><input name="rate" type="number" step="0.01" value="{{h.rate or ''}}"></div>
<div class="form-group"><label>Description</label><input name="description" value="{{h.description or ''}}"></div>
</div>
<div class="btn-group">
<button class="btn btn-primary">Save Changes</button>
<a class="btn btn-secondary" href="/business/hours">Cancel</a>
</div>
</form>
</div>
{% endblock %}
