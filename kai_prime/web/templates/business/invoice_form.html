{% extends "business/base.html" %}
{% block title %}New Invoice — Vision Works{% endblock %}
{% block content %}
<div class="page-header"><h2>New Invoice <small>Add line items with units and categories</small></h2></div>
<div class="form-card">
<form method="POST">
<div class="form-group"><label>Client</label><select name="client_id" required>{% for c in clients %}<option value="{{c.id}}">{{c.name}}</option>{% endfor %}</select></div>
<div class="form-group"><label>Tax Rate (%)</label><input name="tax_rate" type="number" step="0.01" value="0" style="max-width:110px"></div>
<div class="form-group">
<label>Line Items</label>
<button type="button" class="btn btn-secondary btn-sm" onclick="addLine()" style="margin-top:.3rem">+ Add Line</button>
</div>
<div class="table-wrap" style="box-shadow:none">
<div class="table-scroll">
<table id="items">
<tr><th style="width:30px">#</th><th>Description</th><th style="width:90px">Type</th><th style="width:60px">Qty</th><th style="width:55px">Unit</th><th style="width:70px">Rate</th><th style="width:70px">Total</th><th style="width:30px"></th></tr>
<tr class="line">
<td class="line-num">1</td>
<td><input class="desc-input" style="min-width:160px;font-size:.9rem" name="desc[]" placeholder="Description"></td>
<td><select class="cat-select" style="width:100px;font-size:.9rem" name="type[]"><option value="Labor">Labor</option><option value="Material">Material</option><option value="Subcontractor">Sub</option><option value="Equipment">Equipment</option><option value="Permit">Permit</option><option value="Transportation">Transport</option></select></td>
<td><input class="qty-input" style="width:70px;font-size:.9rem" name="qty[]" type="number" step="0.01" value="1"></td>
<td><select class="unit-select" style="width:75px;font-size:.9rem" name="unit[]"><option value="hour">hour</option><option value="sq ft">sq ft</option><option value="linear ft">lin ft</option><option value="each">each</option><option value="load">load</option><option value="day">day</option><option value="sq yd">sq yd</option><option value="mile">mile</option><option value="lump">lump</option></select></td>
<td><input class="rate-input" style="width:80px;font-size:.9rem" name="rate[]" type="number" step="0.01" placeholder="0.00"></td>
<td class="line-total" style="font-weight:700;font-size:.9rem">$0.00</td>
<td><button type="button" class="btn btn-danger btn-sm" onclick="this.closest('tr').remove();renumber()">X</button></td>
</tr>
</table>
</div>
</div>
<div class="form-group"><label>Notes</label><textarea name="notes" rows="2"></textarea></div>
<div class="btn-group">
<button class="btn btn-primary">Create Invoice</button>
<a class="btn btn-secondary" href="/business/invoices">Cancel</a>
</div>
</form>
</div>
<script>
function addLine(){var t=document.getElementById('items');var p=t.rows[1];var r=p.cloneNode(true);r.querySelectorAll('input').forEach(function(i){i.value=''});r.querySelector('.line-total').textContent='$0.00';t.appendChild(r);renumber()}
function renumber(){var rows=document.getElementById('items').querySelectorAll('.line');rows.forEach(function(r,i){r.querySelector('.line-num').textContent=i+1})}
document.getElementById('items').addEventListener('input',function(e){var row=e.target.closest('.line');if(!row)return;var q=parseFloat(row.querySelector('.qty-input').value)||0;var r=parseFloat(row.querySelector('.rate-input').value)||0;row.querySelector('.line-total').textContent='$'+(q*r).toFixed(2)})
</script>
{% endblock %}
