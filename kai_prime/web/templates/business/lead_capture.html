<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Vision Works — Get a Quote</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Segoe UI,sans-serif;background:#1e1e2e;color:#cdd6f4;min-height:100vh;display:flex;align-items:center;justify-content:center}
.card{background:#313244;padding:2.5rem;border-radius:12px;width:100%;max-width:480px;margin:2rem}
h1{color:#89b4fa;margin-bottom:.3rem;font-size:1.5rem}
p.sub{color:#6c7086;margin-bottom:1.5rem;font-size:.9rem}
label{display:block;margin:.8rem 0 .3rem;color:#a6adc8;font-size:.9rem}
input,textarea{width:100%;padding:.6rem;background:#45475a;border:1px solid #585b70;border-radius:6px;color:#cdd6f4;font-size:1rem}
textarea{min-height:90px;font-family:inherit}
input:focus,textarea:focus{outline:none;border-color:#89b4fa}
.btn{background:#89b4fa;color:#1e1e2e;border:none;padding:.7rem 1.5rem;border-radius:6px;font-weight:700;cursor:pointer;margin-top:1rem;font-size:1rem;width:100%}
.btn:hover{background:#74c7ec}
.success{display:none;text-align:center;padding:2rem}
.success h2{color:#a6e3a1;margin-bottom:.5rem}
.success p{color:#a6adc8}
</style>
</head>
<body>
<div class="card" id="formCard">
<h1>Vision Works General Contracting</h1>
<p class="sub">Poplar Bluff, MO — Tell us about your project</p>
<form id="leadForm">
<label>Your Name</label><input name="name" required>
<label>Phone</label><input name="phone" type="tel">
<label>Email</label><input name="email" type="email">
<label>Describe Your Project</label><textarea name="description" placeholder="What kind of work do you need done? Approximate size/budget?"></textarea>
<button class="btn" type="submit">Send Request</button>
</form>
</div>
<div class="card success" id="successCard">
<h2>Thanks!</h2>
<p>We'll review your request and get back to you soon.</p>
</div>
<script>
document.getElementById('leadForm').addEventListener('submit',async function(e){e.preventDefault();var f=new FormData(this);var d={};f.forEach(function(v,k){d[k]=v});var r=await fetch('/api/business/lead',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});if(r.ok){document.getElementById('formCard').style.display='none';document.getElementById('successCard').style.display='block'}else{alert('Error submitting. Please try again.')}})
</script>
</body>
</html>
