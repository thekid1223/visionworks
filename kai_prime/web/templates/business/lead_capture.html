{% extends "business/base.html" %}
{% block title %}Get a Quote — Vision Works{% endblock %}
{% block content %}
<div class="lead-form" id="formCard">
<h2 style="text-align:center;margin-bottom:.3rem">Vision Works General Contracting</h2>
<p style="text-align:center;color:var(--text-muted);font-size:.9rem;margin-bottom:1.5rem">Poplar Bluff, MO — Tell us about your project</p>
<form id="leadForm">
<div class="form-group"><label>Your Name</label><input name="name" required></div>
<div class="form-row">
<div class="form-group"><label>Phone</label><input name="phone" type="tel"></div>
<div class="form-group"><label>Email</label><input name="email" type="email"></div>
</div>
<div class="form-group"><label>Describe Your Project</label><textarea name="description" rows="4" placeholder="What kind of work do you need done? Approximate size/budget?"></textarea></div>
<button class="btn btn-primary" type="submit" style="width:100%;justify-content:center;padding:.75rem">Send Request</button>
</form>
</div>
<div class="lead-form" id="successCard" style="display:none">
<div class="success">
<h3>Thanks!</h3>
<p>We'll review your request and get back to you soon.</p>
</div>
</div>
<script>
document.getElementById('leadForm').addEventListener('submit',async function(e){e.preventDefault();var f=new FormData(this);var d={};f.forEach(function(v,k){d[k]=v});var r=await fetch('/api/business/lead',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});if(r.ok){document.getElementById('formCard').style.display='none';document.getElementById('successCard').style.display='block'}else{alert('Error submitting. Please try again.')}})
</script>
{% endblock %}
