{% extends "business/base.html" %}
{% block title %}Edit Expense — Vision Works{% endblock %}
{% block content %}
<div class="page-header"><h2>Edit Expense</h2></div>
<div class="form-card">
<form method="POST">
<div class="form-group"><label>Category</label><select name="category">{% for cat in categories %}<option value="{{cat}}" {{'selected' if e.category==cat}}>{{cat}}</option>{% endfor %}</select></div>
<div class="form-row">
<div class="form-group"><label>Amount</label><input name="amount" type="number" step="0.01" value="{{e.amount}}" required></div>
<div class="form-group"><label>Date</label><input name="date" type="date" value="{{e.date}}"></div>
</div>
<div class="form-group"><label>Description</label><input name="description" value="{{e.description or ''}}"></div>
<div class="btn-group">
<button class="btn btn-primary">Save Changes</button>
<a class="btn btn-secondary" href="/business/expenses">Cancel</a>
</div>
</form>
</div>
{% endblock %}
